server {
    listen 80;
    listen [::]:80;
    server_name sige.torresasociados.pe;
    charset utf-8;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://sige.torresasociados.pe$request_uri;
    }
}

map $http_cf_connecting_ip $sige_ip_cliente {
    ""      $remote_addr;
    default $http_cf_connecting_ip;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name sige.torresasociados.pe;
    client_max_body_size 25m;
    charset utf-8;

    ssl_certificate     /etc/letsencrypt/live/sige.torresasociados.pe/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sige.torresasociados.pe/privkey.pem;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;
    add_header Content-Security-Policy "frame-ancestors 'none'" always;
    add_header X-Robots-Tag "noindex, nofollow" always;

    location / {
        proxy_pass http://127.0.0.1:3210;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $sige_ip_cliente;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    location ~ "^/subidas(/[0-9a-f-]{36}(/(partes|finalizar))?)?$" {
        client_max_body_size 6m;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_pass http://127.0.0.1:3211;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_set_header Authorization "Bearer $cookie_sige_sesion";
        proxy_set_header X-Cliente-Ip $sige_ip_cliente;
        proxy_set_header X-Agente-Usuario $http_user_agent;
    }

    location ~ "^/archivos/[0-9a-f-]{36}(/(vista|info|hojas))?$" {
        limit_except GET {
            deny all;
        }
        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_pass http://127.0.0.1:3211;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_set_header Authorization "Bearer $cookie_sige_sesion";
        proxy_set_header X-Cliente-Ip $sige_ip_cliente;
        proxy_set_header X-Agente-Usuario $http_user_agent;
    }

    location ~ /\.(?!well-known) {
        deny all;
    }
}
