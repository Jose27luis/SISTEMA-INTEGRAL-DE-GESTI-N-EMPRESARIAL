name: sige-torres

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - sige-net

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: runtime
    image: sige/api:${TAG:-latest}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?schema=public
      CORS_ORIGIN: ${CORS_ORIGIN}
      MFA_CLAVE_CIFRADO: ${MFA_CLAVE_CIFRADO}
      SESION_DURACION_HORAS: ${SESION_DURACION_HORAS:-8}
      SESION_INACTIVIDAD_MINUTOS: ${SESION_INACTIVIDAD_MINUTOS:-30}
      DIRECTORIO_ARCHIVOS: /app/almacen
      PORT: 4000
    ports:
      - "127.0.0.1:${PUERTO_API:-3211}:4000"
    volumes:
      - archivos:/app/almacen
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:4000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 768M
    networks:
      - sige-net

  worker:
    image: sige/api:${TAG:-latest}
    restart: unless-stopped
    command: ["node", "dist/worker.js"]
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?schema=public
      CORS_ORIGIN: ${CORS_ORIGIN}
      MFA_CLAVE_CIFRADO: ${MFA_CLAVE_CIFRADO}
      DIRECTORIO_ARCHIVOS: /app/almacen
      CONVERSOR_URL: http://conversor:3000
      TZ: America/Lima
    volumes:
      - archivos:/app/almacen
    depends_on:
      api:
        condition: service_healthy
      conversor:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 384M
    networks:
      - sige-net

  conversor:
    image: gotenberg/gotenberg:8.15.3
    restart: unless-stopped
    command:
      - gotenberg
      - --api-timeout=180s
      - --chromium-auto-start=false
      - --libreoffice-restart-after=20
      - --log-level=warn
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://127.0.0.1:3000/health >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 1536M
    networks:
      - sige-net

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      target: runtime
    image: sige/web:${TAG:-latest}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      API_INTERNAL_URL: http://api:4000
      PORT: 3000
    ports:
      - "127.0.0.1:${PUERTO_SITIO:-3210}:3000"
    depends_on:
      api:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 512M
    networks:
      - sige-net

volumes:
  pgdata:
  archivos:

networks:
  sige-net:
